<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fde8dc">
  <title>loveletter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="stage" class="stage">
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>
    <a id="writeLink" class="write-link" href="creator/">✎ write a letter</a>
    <button id="summon" class="summon" type="button" hidden>summon postman<span aria-hidden="true">▼</span></button>

    <section id="dialog" class="dialog box" aria-live="polite" hidden>
      <span class="nametag">postman</span>
      <p id="say"></p>
      <form id="details" autocomplete="off" hidden>
        <label>from <input id="sender" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="who sent it?"></label>
        <label>password <input id="password" type="password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        <button id="check" class="btn">check ✉</button>
      </form>
      <span id="more" class="more" aria-hidden="true" hidden>▼</span>
    </section>

    <section id="openView" class="open-view" hidden>
      <div id="envWrap" class="env-wrap">
        <div id="contents" class="contents"></div>
        <canvas id="envBody" class="env-body"></canvas>
        <canvas id="envStrip" class="env-strip"></canvas>
        <canvas id="scissors" class="scissors"></canvas>
      </div>
      <button id="hint" class="hint" type="button"></button>
    </section>

    <section id="readView" class="read-view" hidden>
      <div id="photos" class="photos"></div>
      <article class="paper">
        <p id="letterText" class="letter-text"></p>
        <p class="sig">— <span id="sig"></span></p>
      </article>
      <footer class="fin">
        <p>♥ the end ♥</p>
        <a class="btn" href="creator/">write one back ✎</a>
        <button id="again" class="btn ghost" type="button">read again</button>
        <button id="home" class="btn ghost" type="button">back to home</button>
      </footer>
    </section>

    <div id="lightbox" class="lightbox" role="dialog" aria-label="photo" hidden><img id="lightboxImg" alt=""></div>

    <!-- shows only while someone is invited: see invite.js -->
    <section id="invite" class="invite" role="dialog" aria-label="make your account" hidden>
      <form id="inviteForm" class="box invite-card" autocomplete="off">
        <button id="inviteClose" class="invite-close" type="button" aria-label="close">×</button>
        <p id="inviteText" class="invite-text">know you should have an account? enter the right username and choose a password. if you are who you are supposed to be, account will be created!</p>
        <div id="inviteFields" class="invite-fields">
          <label>username <input id="inviteName" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username"></label>
          <label>password <input id="invitePassword" type="password" autocomplete="new-password"></label>
          <label>password again <input id="invitePassword2" type="password" autocomplete="new-password"></label>
          <p id="inviteError" class="error" role="alert"></p>
          <button id="inviteGo" class="btn">create my account ♥</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
